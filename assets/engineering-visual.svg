<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Infrastructure engineering domain map</title>
  <desc id="desc">A visual map connecting identity, endpoint, network, cloud, and automation engineering domains.</desc>
  <rect width="1200" height="360" rx="14" fill="#050807" stroke="#1C3B2D" stroke-width="2"/>
  <g stroke="#1C3B2D" stroke-width="1"><path d="M40 180H1160M600 40V320" opacity=".7"/></g>
  <g fill="none" stroke="#00FF88" stroke-width="1.8" opacity=".75">
    <path d="M600 180L200 110"/><path d="M600 180L200 250"/><path d="M600 180L1000 110"/><path d="M600 180L1000 250"/>
    <circle cx="600" cy="180" r="76" fill="#0B1110"/>
  </g>
  <g fill="#101A16" stroke="#1C3B2D" stroke-width="2">
    <rect x="116" y="78" width="168" height="64" rx="10"/><rect x="116" y="218" width="168" height="64" rx="10"/>
    <rect x="916" y="78" width="168" height="64" rx="10"/><rect x="916" y="218" width="168" height="64" rx="10"/>
  </g>
  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <text x="200" y="106" fill="#00FF88" font-size="12" letter-spacing="2">IDENTITY</text><text x="200" y="128" fill="#8FA99B" font-size="11">AD / ENTRA / M365</text>
    <text x="200" y="246" fill="#00FF88" font-size="12" letter-spacing="2">ENDPOINT</text><text x="200" y="268" fill="#8FA99B" font-size="11">INTUNE / AUTOPILOT</text>
    <text x="1000" y="106" fill="#00FF88" font-size="12" letter-spacing="2">NETWORK</text><text x="1000" y="128" fill="#8FA99B" font-size="11">L1 / L2 / OPERATIONS</text>
    <text x="1000" y="246" fill="#00FF88" font-size="12" letter-spacing="2">AUTOMATION</text><text x="1000" y="268" fill="#8FA99B" font-size="11">POWERSHELL / IAC</text>
    <text x="600" y="166" fill="#F2FFF8" font-size="18" font-weight="700">INFRASTRUCTURE</text><text x="600" y="192" fill="#00FF88" font-size="12" letter-spacing="3">ENGINEERING DOMAIN</text>
  </g>
</svg>
