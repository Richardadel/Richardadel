<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Richard Fathalla — IT Infrastructure, Systems Engineering, and Cloud Technologies</title>
  <desc id="desc">Black and green technical hero banner with an infrastructure topology and terminal identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050807"/><stop offset="1" stop-color="#0B1110"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00FF88" stop-opacity="0"/><stop offset=".5" stop-color="#00FF88" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00FF88" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#1C3B2D" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="380" rx="12" fill="url(#grid)"/>
  <circle cx="44" cy="44" r="5" fill="#FF5F56"/><circle cx="62" cy="44" r="5" fill="#FFBD2E"/><circle cx="80" cy="44" r="5" fill="#27C93F"/>
  <line x1="20" y1="64" x2="1180" y2="64" stroke="#1C3B2D"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="56" y="116" fill="#8AFFC1" font-size="15" letter-spacing="4">SYSTEM.IDENTITY</text>
    <text x="56" y="180" fill="#F2FFF8" font-size="62" font-weight="800" letter-spacing="1">RICHARD FATHALLA</text>
    <text x="56" y="218" fill="#00FF88" font-size="20" font-weight="700" letter-spacing="4">IT INFRASTRUCTURE / SYSTEMS / CLOUD</text>
    <text x="56" y="260" fill="#8FA99B" font-size="15">richard_fathalla@engineering:~$</text>
    <rect x="344" y="247" width="9" height="17" fill="#00FF88">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="none" stroke="#00FF88" stroke-width="1.5" opacity=".72">
    <path d="M720 294C780 238 820 238 870 294S960 350 1010 294"/><path d="M720 294H840V164H1040"/>
    <circle cx="720" cy="294" r="8" fill="#050807"/><circle cx="840" cy="294" r="8" fill="#050807"/>
    <circle cx="840" cy="164" r="8" fill="#050807"/><circle cx="1040" cy="164" r="8" fill="#050807"/>
    <circle cx="1010" cy="294" r="8" fill="#050807"/>
  </g>
  <g fill="#101A16" stroke="#1C3B2D">
    <rect x="786" y="126" width="108" height="76" rx="8"/><rect x="986" y="126" width="108" height="76" rx="8"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#8AFFC1" text-anchor="middle">
    <text x="840" y="160">IDENTITY</text><text x="840" y="181">CLOUD</text>
    <text x="1040" y="160">ENDPOINT</text><text x="1040" y="181">SYSTEMS</text>
  </g>
  <line x1="56" y1="342" x2="1144" y2="342" stroke="url(#glow)" stroke-width="2"/>
</svg>
