<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Richard Adel Fathalla infrastructure engineering profile</title>
  <desc id="description">A terminal-inspired profile banner for an IT infrastructure and cloud engineering professional.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF88" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FF88"/>
      <stop offset="1" stop-color="#00FF88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00FF88" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#050505"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="url(#panel)" stroke="#1A2320" stroke-width="2"/>
  <rect x="20" y="20" width="1160" height="280" rx="12" fill="url(#grid)" opacity="0.9"/>

  <circle cx="42" cy="42" r="6" fill="#FF5F56"/>
  <circle cx="62" cy="42" r="6" fill="#FFBD2E"/>
  <circle cx="82" cy="42" r="6" fill="#27C93F"/>
  <line x1="20" y1="62" x2="1180" y2="62" stroke="#1F2933" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="54" y="112" fill="#00FF88" font-size="15" font-weight="700" letter-spacing="3">SYSTEM PROFILE // ID_001</text>
    <text x="54" y="164" fill="#F0F6FC" font-size="42" font-weight="800" letter-spacing="1">RICHARD ADEL FATHALLA</text>
    <text x="54" y="198" fill="#39FF14" font-size="18" font-weight="700" letter-spacing="3">IT INFRASTRUCTURE ENGINEER</text>
    <text x="54" y="224" fill="#8B949E" font-size="15" letter-spacing="2">CLOUD + SYSTEMS ENGINEERING</text>

    <text x="744" y="112" fill="#00FF88" font-size="14">$ whoami</text>
    <text x="744" y="142" fill="#F0F6FC" font-size="14">Enterprise IT Professional</text>
    <text x="744" y="166" fill="#8B949E" font-size="13">Azure  ·  Entra ID  ·  Intune</text>
    <text x="744" y="190" fill="#8B949E" font-size="13">Identity  ·  Endpoints  ·  Networks</text>
    <text x="744" y="214" fill="#39FF14" font-size="13">Building toward Cloud + AI</text>
    <rect x="744" y="228" width="8" height="14" rx="1" fill="#00FF88" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="54" y1="258" x2="1146" y2="258" stroke="url(#line)" stroke-width="1"/>

  <g fill="none" stroke="#00FF88" stroke-opacity="0.36" stroke-width="1.2">
    <path d="M700 258V246H820V258"/>
    <path d="M860 258V236H978V258"/>
    <circle cx="700" cy="258" r="4" fill="#050505"/>
    <circle cx="820" cy="258" r="4" fill="#050505"/>
    <circle cx="860" cy="258" r="4" fill="#050505"/>
    <circle cx="978" cy="258" r="4" fill="#050505"/>
  </g>
</svg>
